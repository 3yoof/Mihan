<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="مِهن منصة سعودية تساعد طلاب وطالبات المرحلة الثانوية على اكتشاف ميولهم واستكشاف التخصصات الجامعية والتخطيط لمستقبلهم المهني.">
<title>مِهن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14246B;
  --ink:#1B2B6B;
  --blue:#2F6FE4;
  --blue-soft:#5B8DEF;
  --blue-deep:#2D5FC4;
  --line:#BFD1F7;
  --text:#3A4670;
  --muted:#4A5578;
  --bg:#F6F8FF;
  --tint:#E3ECFF;
  --white:#fff;
  --display:'Cairo',system-ui,sans-serif;
  --body:'Almarai','Cairo',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
a{color:var(--ink)}
a:hover{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--ink)}
.nav ul{list-style:none;margin:0 auto;padding:6px 8px;max-width:1100px;display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-family:var(--display);font-weight:600;font-size:16px;text-decoration:underline;text-underline-offset:5px}
.nav a[aria-current="page"]{color:var(--blue);font-weight:800}

/* shared */
.page{min-height:60vh;background:linear-gradient(180deg,var(--page-tint,#E9F0FF) 0,var(--bg) 340px,#fff 100%)}
.sparkle{display:inline-block;vertical-align:middle}
.divider{display:flex;align-items:center;gap:12px;width:min(320px,100%);margin-inline:auto}
.divider i{flex:1;height:1px;background:#8FB1F5}
.pillhead{display:inline-block;margin:0;padding:6px 28px;border-radius:999px;background:linear-gradient(180deg,#D6E3FF,#E6EEFF);font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,26px);color:var(--navy);line-height:1.5}
.box{position:relative;margin-top:36px;padding:36px 22px 22px;border:1.5px solid var(--line);border-radius:30px;background:rgba(255,255,255,.75)}
.box>.pillhead{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.box p{text-align:center;color:var(--ink);font-size:clamp(17px,2.2vw,21px)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 44px;border:0;border-radius:999px;background:linear-gradient(180deg,#4A7FE6,#2D4FB4);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;text-decoration:underline;text-underline-offset:6px;cursor:pointer;box-shadow:0 8px 20px rgba(45,79,180,.3)}
.btn:hover{color:#fff;filter:brightness(1.08)}
.title-xl{font-family:var(--display);font-weight:800;color:var(--navy);line-height:1.25}
.lead{color:var(--text);font-size:clamp(18px,2.4vw,24px);line-height:1.9}
.accent{color:var(--blue)}
.sec-head{text-align:center;padding:56px 0 8px}
.sec-head .title-xl{font-size:clamp(36px,6vw,64px)}
.sec-head .lead{margin:12px auto 0;max-width:34ch}
.under{display:block;margin:6px auto 0}
.notice{margin:20px auto 0;max-width:34rem;padding:14px 20px;border:1.5px solid var(--line);border-radius:20px;background:#fff;text-align:center;color:var(--text)}
.notice[hidden]{display:none}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 48px;padding:56px 0 72px}
.hero-text{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.hero-art{flex:1 1 340px;min-width:0;display:flex;justify-content:center}
.hero-art svg{width:100%;max-width:520px;height:auto}
.hero h1{font-size:clamp(72px,12vw,128px);line-height:1.1}
.hero .tag{font-size:clamp(28px,4.4vw,48px)}
.values{display:flex;flex-wrap:wrap;margin-top:28px}
.value{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 24px;text-align:center}
.value+.value{border-inline-start:1px solid var(--line)}
.value .ic{width:88px;height:72px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center}
.value h3{font-family:var(--display);font-weight:800;font-size:24px;color:var(--navy)}
.value p{color:var(--muted);font-size:17px;max-width:20ch}
.closing{margin-top:48px;padding:44px 16px 64px;text-align:center;background:linear-gradient(180deg,#fff,#DCE7FF)}
.closing p{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,32px);color:var(--navy);margin-top:14px}

/* compass */
.compass{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 40px;padding:48px 0 12px}
.compass .txt{flex:1 1 320px;min-width:0}
.compass .art{flex:1 1 300px;min-width:0;display:flex;justify-content:center}
.compass .art svg{width:100%;max-width:420px;height:auto}
.center{text-align:center}
.steps3{display:flex;flex-wrap:wrap;margin-top:6px}
.steps3>div{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 12px;text-align:center}
.steps3>div+div{border-inline-start:1px solid var(--line)}
.steps3 .ic{width:56px;height:56px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--display);font-weight:800;font-size:14px}
.steps3 p{font-size:16px;color:var(--ink)}

/* majors */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px;margin-top:28px}
.mcard{display:flex;align-items:center;gap:14px;min-width:0;padding:16px 18px;border:1.5px solid var(--c2,#BFD1F7);border-radius:22px;background:var(--c1,#E6EEFF);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
a.mcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,36,107,.12);color:var(--ink)}
.mcard .mi{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:var(--c3,#2D5FC4)}
.mcard h3{font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy);line-height:1.4}
.mcard p{font-size:16px;color:var(--muted);line-height:1.6}
.mcard .soon{display:inline-block;margin-top:4px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.8);font-size:13px;color:var(--muted)}
.mcard>div:last-child{min-width:0}

/* major detail */
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-family:var(--display);font-weight:600}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:20px 36px;justify-content:center;padding:20px 0 6px}
.mhead .mi{width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid var(--c2);display:flex;align-items:center;justify-content:center;color:var(--c3)}
.mhead .mi svg{width:76px;height:76px}
.mhead .t{min-width:0;text-align:center}
.mhead h1{font-size:clamp(40px,7vw,72px)}
.mhead p{color:var(--text);font-size:clamp(17px,2.2vw,22px)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chip{padding:4px 16px;border-radius:999px;background:var(--c1,#E6EEFF);border:1px solid var(--c2,#BFD1F7);color:var(--navy);font-size:16px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.job{padding:14px 16px;border-radius:18px;background:var(--c1);border:1px solid var(--c2);min-width:0}
.job h4{font-family:var(--display);font-weight:800;font-size:19px;color:var(--navy);line-height:1.5}
.job p{font-size:16px;color:var(--muted);line-height:1.7;text-align:start}
.mbox{border-color:var(--c2)}
.mbox>.pillhead{background:var(--c1);border:1px solid var(--c2)}
.fit{margin:36px 0 0;padding:20px 22px;border-radius:26px;background:var(--c1);border:1.5px solid var(--c2);text-align:center}
.fit h3{font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy)}
.fit p{color:var(--text)}
.fit small{display:block;margin-top:6px;color:var(--muted);font-size:15px}

/* balance */
.what{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.what p{flex:1 1 260px;min-width:0}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin-top:8px}
.how>div{position:relative;padding:34px 14px 16px;border-radius:22px;border:1.5px solid var(--c2);background:var(--c1);text-align:center}
.how .num{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:34px;height:34px;font-size:17px;background:var(--c3)}
.how h4{font-family:var(--display);font-weight:800;font-size:19px;color:var(--navy)}
.how p{font-size:16px;color:var(--muted);line-height:1.7}
.tool{margin-top:48px;padding:24px 20px;border-radius:30px;border:1.5px solid var(--line);background:#fff;scroll-margin-top:70px}
.tool h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,34px);color:var(--navy);text-align:center}
.pickers{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0}
.pickers label{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;max-width:320px;font-family:var(--display);font-weight:600;color:var(--navy)}
select{min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-family:var(--body);font-size:17px}
.cmp{display:grid;gap:12px}
.cmp .row{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.cmp .row h4{margin:0;padding:8px 16px;background:var(--tint);font-family:var(--display);font-weight:800;font-size:18px;color:var(--navy)}
.cmp .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.cmp .cols>div{padding:12px 16px;font-size:16px;color:var(--text);line-height:1.8;min-width:0}
.cmp .cols>div+div{border-inline-start:1px solid var(--line)}
.cmp .cols b{display:block;font-family:var(--display);color:var(--blue-deep);font-size:15px}
.cmp-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.cmp-head div{padding:14px;border-radius:18px;text-align:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--navy);background:var(--c1);border:1.5px solid var(--c2)}

/* about */
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bullets li{display:flex;align-items:flex-start;gap:12px;color:var(--ink);font-size:clamp(17px,2.2vw,21px)}
.bullets svg{flex:none;margin-top:8px}
.statement{margin:36px 0 0;padding:20px 24px;border-radius:26px;background:linear-gradient(180deg,#DCE7FF,#E8EFFF);text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,2.8vw,28px);color:var(--navy)}
.pad-b{padding-bottom:72px}
footer{padding:28px 16px 40px;text-align:center;color:var(--muted);font-size:15px;background:#fff;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:640px){
  .value+.value,.steps3>div+div{border-inline-start:0;border-top:1px solid var(--line)}
  .cmp .cols>div+div{border-inline-start:0;border-top:1px solid var(--line)}
}
</style>
</head>

      '<rect x="40" y="30" width="72" height="72" rx="20" fill="#E3ECFF" stroke="#fff" stroke-width="3"/><g transform="translate(52 42)" color="#2D5FC4">'+ico('target',48)+'</g>' +
      '<rect x="320" y="46" width="64" height="64" rx="18" fill="#E3ECFF" stroke="#fff" stroke-width="3"/><g transform="translate(332 58)" color="#2D5FC4">'+ico('biz',40)+'</g>' +
      '</svg></div>' +
  '</section>' +
  '<div class="center" style="margin:8px 0 12px">' + toolButton('ابدأ الاختبار', CONFIG.quizUrl, 'quiz-soon') + '</div>' +

    '<div class="steps3">' +
      '<div><div class="ic">'+ico('bulb',30)+'</div><span class="num">1</span><p>أجب عن الأسئلة بصدق</p></div>' +
      '<div><div class="ic"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="#2D5FC4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="24" r="18"/><path d="M24 12 V24 L32 29"/></svg></div><span class="num">2</span><p>خصص بضع دقائق فقط</p></div>' +
      '<div><div class="ic">'+ico('biz',30)+'</div><span class="num">3</span><p>اكتشف نتائجك وتعرف على أفضل المجالات</p></div>' +
    '</div>') +
  '<div class="center" style="margin-top:40px">'+DIVIDER+'<p class="title-xl" style="font-size:clamp(20px,2.6vw,28px);margin-top:10px">ابدأ رحلتك نحو مستقبل يليق بك</p></div>' +

function pageMajors(){
  var cards = MAJORS.map(function(m){
    var inner = '<div class="mi">'+ico(m.icon,34)+'</div><div><h3>'+m.name+'</h3><p>'+m.card+'</p>'+(m.soon?'<span class="soon">قريباً</span>':'')+'</div>';
    return m.soon
      ? '<div class="mcard" style="'+cvars(m)+'">'+inner+'</div>'
      : '<a class="mcard" href="#/major/'+m.id+'" style="'+cvars(m)+'">'+inner+'</a>';
  }).join('');
  return '<div class="page"><div class="wrap pad-b">' +
    '<header class="sec-head"><h1 class="title-xl">التخصصات</h1><svg class="under" width="220" height="20" viewBox="0 0 220 20" aria-hidden="true"><path d="M4 14 C60 2 150 2 216 8" fill="none" stroke="#5B8DEF" stroke-width="4" stroke-linecap="round"/></svg>' +
    '<p class="lead">اكتشف أبرز التخصصات الجامعية وتعرّف على مجالاتها وفرصها المستقبلية.</p></header>' +
    '<div class="mgrid">'+cards+'</div>' +
    '<div class="center" style="margin-top:44px">'+DIVIDER+'<p class="title-xl" style="font-size:clamp(20px,2.6vw,28px);margin-top:10px">اختر التخصص الذي يليق بك .. وابدأ رحلتك نحو مستقبلك المشرق</p></div>' +
  '</div></div>';
}

function pageMajor(id){
  var m = byId(id);
  if (!m || m.soon) return pageMajors();
  var jobs = '<div class="jobs">'+m.jobs.map(function(j){return '<div class="job"><h4>'+j[0]+'</h4><p>'+j[1]+'</p></div>';}).join('')+'</div>';
  return '<div class="page" style="--page-tint:'+m.c[0]+';'+cvars(m)+'"><div class="wrap pad-b">' +
    '<a class="back" href="#/majors">← العودة إلى التخصصات</a>' +
    '<header class="mhead"><div class="mi">'+ico(m.icon,76)+'</div><div class="t"><h1 class="title-xl">'+m.name+'</h1><p>'+m.sub+'</p></div></header>' +
    box(id==='biz'?'ما هو تخصص إدارة الأعمال؟':'ما هو التخصص؟', '<p>'+m.desc+'</p>', 'mbox') +
    box('ماذا تدرس؟', chips(m.study), 'mbox') +
    box('ماذا يعمل الخريج؟', jobs, 'mbox') +
    box('أين يمكنه العمل؟', chips(m.where), 'mbox') +
    box('المهارات التي تساعدك', chips(m.skills), 'mbox') +
    box('كيف يبدو مستقبله؟', '<p>'+m.future+'</p>', 'mbox') +
    '<section class="fit"><h3>'+m.fitQ+'</h3><p>'+m.fit+'</p>'+(m.note?'<small>'+m.note+'</small>':'')+'</section>' +
  '</div></div>';
}

var balState = {a:'med', b:'ind'};
function optionList(sel){
  return MAJORS.filter(function(m){return !m.soon;}).map(function(m){
    return '<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+m.name+'</option>';
  }).join('');
}
function cmpRow(label, a, b){
  return '<div class="row"><h4>'+label+'</h4><div class="cols"><div><b>'+byId(balState.a).name+'</b>'+a+'</div><div><b>'+byId(balState.b).name+'</b>'+b+'</div></div></div>';
}
function renderCompare(){
  var A = byId(balState.a), B = byId(balState.b);
  var out = document.getElementById('cmp-out');
  if (!out) return;
  if (A.id === B.id){ out.innerHTML = '<p class="notice">اختر تخصصين مختلفين للمقارنة بينهما.</p>'; return; }
  var j = function(m){ return m.jobs.map(function(x){return x[0];}).join(' • '); };
  out.innerHTML =
    '<div class="cmp-head"><div style="'+cvars(A)+'">'+A.name+'</div><div style="'+cvars(B)+'">'+B.name+'</div></div>' +
    '<div class="cmp">' +
    cmpRow('المواد الدراسية', A.study.join(' • '), B.study.join(' • ')) +
    cmpRow('المهارات المطلوبة', A.skills.join(' • '), B.skills.join(' • ')) +
    cmpRow('ماذا يعمل الخريج؟', j(A), j(B)) +
    cmpRow('مجالات العمل', A.where.join(' • '), B.where.join(' • ')) +
    cmpRow('الفرص المستقبلية', A.future, B.future) +
    '</div>';
}
function pageBalance(){
  var c = ['#E1ECFF','#B7CDFA','#2D5FC4'], p=['#EFE3FF','#D2BCF5','#7A4FD6'], g=['#E2F5E3','#B9E2BB','#3E8E47'], o=['#FFEBD2','#F6C98F','#E08A2B'];
  var steps = [
    ['1','اختر تخصصين:','حدد التخصصين اللذين ترغب في المقارنة بينهما.',c],
    ['2','قارن بينهما:','اطّلع على الاختلافات في المواد الدراسية والمهارات المطلوبة.',p],
    ['3','اكتشف المستقبل:','تعرف على مجالات العمل والفرص المهنية لكل تخصص.',g],
    ['4','راجع النتيجة:','اكتشف التخصص الأقرب إلى ميولك وأهدافك.',o]
  ].map(function(s){ return '<div style="--c1:'+s[3][0]+';--c2:'+s[3][1]+';--c3:'+s[3][2]+'"><span class="num">'+s[0]+'</span><h4>'+s[1]+'</h4><p>'+s[2]+'</p></div>'; }).join('');
  return '<div class="page"><div class="wrap pad-b">' +
    '<header class="sec-head"><h1 class="title-xl">ميزان <span style="color:var(--navy)">مِهن</span></h1>' +
    '<p class="lead">قارن بين تخصصاتك، واكتشف الخيار الأقرب لطموحك.</p></header>' +
    box('ما هي الأداة؟', '<p>ميزان مِهن أداة تساعدك على مقارنة تخصصين جامعيين من جوانب مختلفة، لتتعرف على مميزات كل تخصص وتحدد أيهما يتناسب أكثر مع اهتماماتك وأهدافك المستقبلية.</p>') +
    box('كيف تستخدم ميزان مِهن؟', '<div class="how">'+steps+'</div>') +
    box('ماذا ستقارن الأداة؟', chips(['المواد الدراسية','المهارات المطلوبة','مجالات العمل','الفرص المستقبلية'])) +
    '<div class="center" style="margin-top:32px"><a class="btn" href="#tool" data-scroll="tool">ابدأ المقارنة</a></div>' +
    '<section class="tool" id="tool"><h2>قارن بين تخصصين</h2>' +
    '<div class="pickers"><label>التخصص الأول<select id="selA">'+optionList(balState.a)+'</select></label><label>التخصص الثاني<select id="selB">'+optionList(balState.b)+'</select></label></div>' +
    '<div id="cmp-out" aria-live="polite"></div></section>' +
  '</div></div>';
}

function pageFuture(){
  var c = ['#E1ECFF','#B7CDFA','#2D5FC4'];
  return '<div class="page" style="--page-tint:#EDEBFF"><div class="wrap pad-b">' +
    '<header class="sec-head"><h1 class="title-xl">مهن المستقبل</h1></header>' +
    box('عن الأداة', '<p>اختر سنة تخرجك من الجامعة، واكتشف التخصصات المتوقع أن يزداد الطلب عليها في سوق العمل.</p>') +
    box('كيف تستخدم الأداة؟',
      '<div class="steps3">' +
      '<div><div class="ic">'+ico('target',30)+'</div><span class="num">1</span><p>اضغط على بدء البحث</p></div>' +
      '<div><div class="ic"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="#2D5FC4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="9" width="36" height="32" rx="4"/><path d="M6 19 H42"/><path d="M16 5 V13"/><path d="M32 5 V13"/></svg></div><span class="num">2</span><p>اختر سنة تخرجك من الجامعة</p></div>' +
      '<div><div class="ic">'+ico('biz',30)+'</div><span class="num">3</span><p>اطّلع على النتائج</p></div>' +
      '</div>') +
    '<div class="center" style="margin-top:36px">'+toolButton('استكشف مستقبل تخصصك', CONFIG.futureUrl, 'future-soon')+'</div>' +
  '</div></div>';
}

function pageAbout(){
  var li = ['اكتشاف التخصصات الجامعية والمهنية.','معرفة التخصصات المتوقع زيادة الطلب عليها.','مقارنة التخصصات واختيار الأنسب لك.','التعرف على المهن والفرص المستقبلية.']
    .map(function(t){return '<li>'+SPARK+'<span>'+t+'</span></li>';}).join('');
  return '<div class="page"><div class="wrap pad-b" style="max-width:820px">' +
    '<header class="sec-head"><h1 class="title-xl">عن مهن</h1>'+DIVIDER+'</header>' +
    box('من نحن؟',
      '<p>مِهن هي منصة سعودية تهدف إلى مساعدة طلاب وطالبات المرحلة الثانوية في التخطيط لمستقبلهم الجامعي والمهني.</p>' +
      '<p style="margin-top:12px">انطلقت فكرة مِهن من إيماننا بأن اختيار التخصص الجامعي خطوة مهمة تستحق الوعي والمعرفة.</p>' +
      '<p style="margin-top:12px">نسعى إلى تسهيل رحلة اكتشاف التخصصات والمهن، وتقديم المعلومات بطريقة بسيطة ومنظمة.</p>') +
    box('ماذا تقدم؟', '<ul class="bullets">'+li+'</ul>') +
    '<p class="statement">مِهن .. اكتشف، قارن، وخطّط لمستقبلك بثقة.</p>' +
  '</div></div>';
}

/* router */
var app = document.getElementById('app');
function route(){
  var h = (location.hash || '#/home').replace(/^#\/?/, '');
  var parts = h.split('/');
  var page = parts[0] || 'home';
  if (page === 'tool'){ return; }
  var html, nav = page;
  if (page === 'home') html = pageHome();
  else if (page === 'compass') html = pageCompass();
  else if (page === 'majors') html = pageMajors();
  else if (page === 'major'){ html = pageMajor(parts[1]); nav = 'majors'; }
  else if (page === 'balance') html = pageBalance();
  else if (page === 'future') html = pageFuture();
  else if (page === 'about') html = pageAbout();
  else { html = pageHome(); nav = 'home'; }
  app.innerHTML = html;
  var links = document.querySelectorAll('[data-nav]');
  for (var i=0;i<links.length;i++){
    if (links[i].getAttribute('data-nav') === nav) links[i].setAttribute('aria-current','page');
    else links[i].removeAttribute('aria-current');
  }
  var m = (page==='major' && byId(parts[1])) ? byId(parts[1]).name + ' - ' : '';
  document.title = m + 'مِهن';
  window.scrollTo(0,0);
  if (page === 'balance') bindBalance();
  bindSoon();
}
function bindBalance(){
  var a = document.getElementById('selA'), b = document.getElementById('selB');
  if (a) a.addEventListener('change', function(){ balState.a = a.value; renderCompare(); });
  if (b) b.addEventListener('change', function(){ balState.b = b.value; renderCompare(); });
  var s = document.querySelector('[data-scroll]');
  if (s) s.addEventListener('click', function(e){ e.preventDefault(); var t = document.getElementById('tool'); if (t) t.scrollIntoView({behavior:'smooth'}); });
  renderCompare();
}
function bindSoon(){
  var btns = document.querySelectorAll('[data-soon]');
  for (var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      var n = document.getElementById(this.getAttribute('data-soon'));
      if (n) n.hidden = false;
    });
  }
}
window.addEventListener('hashchange', route);
route();
</script>
